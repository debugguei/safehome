<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>SafeHome</title>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#2f6bff">
  <style>
    #sh-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:16px;background:#2f6bff;
      transition:opacity .35s ease;}
    #sh-splash.oculto{opacity:0;pointer-events:none;}
    #sh-splash svg{width:72px;height:72px;}
    #sh-splash span{color:#fff;font:700 1.15rem -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;letter-spacing:.01em;}
    @media (prefers-color-scheme: dark){#sh-splash{background:#0d1017;}}
  </style>
</head>
<body>
  <div id="sh-splash">
    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M24 9 L38 19 V35 a2 2 0 0 1-2 2 H12 a2 2 0 0 1-2-2 V19 Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
      <circle cx="24" cy="25" r="3.6" fill="#fff"/>
      <path d="M24 28.6 V33" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <span>SafeHome</span>
  </div>
  <app-root></app-root>
  <script>
    (function(){
      var hide=function(){var s=document.getElementById('sh-splash');if(s){s.classList.add('oculto');setTimeout(function(){s.remove();},400);}};
      var obs=new MutationObserver(function(){if(document.querySelector('ion-app')){obs.disconnect();setTimeout(hide,250);}});
      obs.observe(document.body,{childList:true,subtree:true});
      setTimeout(hide,3500);
    })();
  </script>
</body>
</html>
